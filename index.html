<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="doc-title">Загрузка...</title>
    <meta id="doc-desc" name="description" content="Видеопродакшн и моушн-дизайн">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-dark: #09090b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #8b5cf6;
            --accent-glow: rgba(139, 92, 246, 0.5);
            --card-bg: rgba(255, 255, 255, 0.03);
            --border-color: rgba(255, 255, 255, 0.1);
            --main-font: 'Inter', system-ui, sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: var(--main-font);
            line-height: 1.6;
            overflow-x: hidden;
        }

        header {
            border-bottom: 1px solid var(--border-color);
            background: rgba(9, 9, 11, 0.85);
            backdrop-filter: blur(12px);
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 100;
        }

        nav {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        main { padding-top: 100px; }
        section { max-width: 1200px; margin: 0 auto; padding: 5rem 2rem; }

        .hero { text-align: center; position: relative; padding-top: 6rem; padding-bottom: 4rem; }
        .hero::before {
            content: '';
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 400px; height: 400px;
            background: var(--accent);
            filter: blur(150px);
            opacity: 0.35;
            z-index: -1;
        }

        h1 { font-size: clamp(2.5rem, 5vw, 4rem); line-height: 1.1; margin-bottom: 1.5rem; font-weight: 800; }
        .hero p { color: var(--text-muted); font-size: 1.25rem; max-width: 700px; margin: 0 auto 2rem; }

        .cta-btn {
            display: inline-block;
            background: var(--accent);
            color: #ffffff;
            padding: 1rem 2.5rem;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 0 25px var(--accent-glow);
            border: none;
        }
        .cta-btn:hover { transform: translateY(-2px); box-shadow: 0 0 35px var(--accent-glow); }

        h2 { font-size: 2.5rem; margin-bottom: 3rem; text-align: center; font-weight: 700; }

        .services-grid, .portfolio-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
        }

        .service-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 2rem;
            border-radius: 16px;
            backdrop-filter: blur(5px);
            transition: transform 0.3s, border-color 0.3s;
        }
        .service-card:hover { transform: translateY(-5px); border-color: var(--accent); }
        .service-card h3 { font-size: 1.25rem; margin-bottom: 1rem; color: #ffffff; }
        .service-card p { color: var(--text-muted); font-size: 0.95rem; }

        .portfolio-item {
            border-radius: 12px;
            overflow: hidden;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            text-decoration: none;
            color: inherit;
            display: block;
            transition: border-color 0.3s, transform 0.3s;
        }
        .portfolio-item:hover { border-color: var(--accent); transform: translateY(-4px); }
        .portfolio-item img { width: 100%; height: 250px; object-fit: cover; border-bottom: 1px solid var(--border-color); }
        .portfolio-content { padding: 1.5rem; }
        
        .seo-text p { color: var(--text-muted); font-size: 0.95rem; text-align: center; max-width: 800px; margin: 0 auto; }
        footer { border-top: 1px solid var(--border-color); padding: 3rem 2rem; text-align: center; color: var(--text-muted); }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(8px);
            display: flex; justify-content: center; align-items: center;
            opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
            z-index: 9999;
        }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        
        .modal-content {
            background: var(--bg-dark); border: 1px solid var(--accent);
            padding: 3rem 2rem; border-radius: 20px; text-align: center;
            position: relative; transform: translateY(30px); transition: transform 0.3s ease;
            box-shadow: 0 0 40px var(--accent-glow);
            max-width: 90%; width: 380px;
        }
        .modal-overlay.active .modal-content { transform: translateY(0); }
        
        .modal-close {
            position: absolute; top: 15px; right: 20px; background: none; border: none;
            color: var(--text-muted); font-size: 2rem; cursor: pointer; transition: color 0.3s;
        }
        .modal-close:hover { color: white; }
        
        .tg-link {
            display: inline-flex; align-items: center; gap: 12px;
            background: #2AABEE; color: white; padding: 1rem 2rem;
            border-radius: 50px; text-decoration: none; font-weight: 600; font-size: 1.1rem;
            margin-top: 1.5rem; transition: transform 0.3s, box-shadow 0.3s;
        }
        .tg-link:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(42, 171, 238, 0.4); }
        .tg-link svg { width: 26px; height: 26px; fill: white; }
    </style>
</head>
<body>

    <header>
        <nav>
            <img src="logo.png" alt="Логотип" style="height: 90px; object-fit: contain;">
            <a href="#contacts" class="cta-btn" style="padding: 0.6rem 1.5rem; font-size: 0.9rem;">Связаться</a>
        </nav>
    </header>

    <main>
        <section class="hero">
            <h1 id="dyn-hero-title">Загрузка...</h1>
            <p id="dyn-hero-subtitle">Подключение к базе...</p>
            <a href="#portfolio" class="cta-btn">Смотреть работы</a>
        </section>

        <section id="services">
            <h2>Наши услуги и форматы</h2>
            <div class="services-grid" id="dyn-services"></div>
        </section>

        <section id="portfolio">
            <h2>Наше портфолио</h2>
            <div class="portfolio-grid" id="dyn-portfolio"></div>
        </section>

        <section class="seo-text">
            <h2 id="dyn-seo-title" style="font-size: 1.8rem; margin-bottom: 1rem;">Загрузка...</h2>
            <p id="dyn-seo-text">Загрузка...</p>
        </section>
    </main>

    <footer id="contacts">
        <p>&copy; <span id="year"></span> Ваш Бренд. Готовы заказать ролики? Напишите нам.</p>
    </footer>

    <div id="contact-modal" class="modal-overlay">
        <div class="modal-content">
            <button class="modal-close">&times;</button>
            <h3 style="font-size: 1.5rem; margin-bottom: 0.5rem; color: #fff;">Свяжитесь со мной</h3>
            <p style="color: var(--text-muted); font-size: 0.95rem;">Обсудим ваш проект и задачи</p>
            
            <a href="https://t.me/mikerover" target="_blank" class="tg-link">
                <svg viewBox="0 0 24 24">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69.01-.03.01-.14-.07-.19-.08-.05-.19-.02-.27 0-.12.03-1.96 1.25-5.54 3.67-.52.36-1 .53-1.42.52-.47-.01-1.37-.26-2.03-.48-.82-.27-1.47-.42-1.42-.88.03-.24.38-.49 1.07-.75 4.2-1.83 7-3.04 8.41-3.63 4-.1 4.83.67 4.9 1.05z"/>
                </svg>
                <span>@mikerover</span>
            </a>
        </div>
    </div>

    <script>
        document.getElementById('year').textContent = new Date().getFullYear();

        async function loadContent() {
            let data;
            
            try {
                // Пытаемся сформировать правильный URL для загрузки (помогает избежать ошибок в песочницах)
                const fetchUrl = new URL('content.json?nocache=' + Date.now(), window.location.href);
                const response = await fetch(fetchUrl);
                
                if (!response.ok) {
                    throw new Error('Файл не найден на сервере');
                }
                
                data = await response.json();
            } catch (error) {
                console.warn("Файл content.json недоступен (вероятно, включен предпросмотр). Загружаем демо-данные.", error);
                // Запасные данные, чтобы сайт работал и выглядел красиво в любых условиях предпросмотра
                data = {
                    "meta_title": "Заказать видео | Рекламные ролики",
                    "meta_description": "Создаем рекламные ролики, презентации и контент.",
                    "hero_title": "Профессиональный продакшн: заказать видео и ролики",
                    "hero_subtitle": "Ищете, где заказать видео для бизнеса? Мы создаем потрясающие видео, коммерческую анимацию и контент, который увеличивает продажи.",
                    "services": [
                        { "icon": "🎬", "title": "Реклама и Промо", "description": "Нужно заказать видео рекламу? Мы знаем, как привлечь внимание. Вы можете заказать рекламный ролик любой сложности." },
                        { "icon": "📦", "title": "Для Маркетплейсов", "description": "Селлерам изготовим видео товара с инфографикой. Спрашиваете про видео Озон — мы берем всё на себя." },
                        { "icon": "📊", "title": "Презентации", "description": "У нас можно заказать слайд-шоу, презентации проекта, нового товара или бизнеса." }
                    ],
                    "portfolio": [],
                    "seo_title": "Где заказать ролики под ключ?",
                    "seo_text": "Если вы думаете, где заказать ролики, наш продакшн предлагает полный цикл производства."
                };
            }

            try {
                // Функция безопасной вставки текста
                const setText = (id, text) => {
                    const el = document.getElementById(id);
                    if (el) el.innerHTML = text;
                };

                setText('doc-title', data.meta_title || 'Портфолио');
                
                const descMeta = document.getElementById('doc-desc');
                if(descMeta) descMeta.setAttribute('content', data.meta_description || '');

                setText('dyn-hero-title', data.hero_title || 'Добро пожаловать');
                setText('dyn-hero-subtitle', data.hero_subtitle || '');
                setText('dyn-seo-title', data.seo_title || '');
                setText('dyn-seo-text', data.seo_text || '');

                const servicesContainer = document.getElementById('dyn-services');
                servicesContainer.innerHTML = '';
                if (data.services && data.services.length > 0) {
                    data.services.forEach(srv => {
                        servicesContainer.innerHTML += `
                            <article class="service-card">
                                <div style="font-size: 2.5rem; margin-bottom: 10px;">${srv.icon || '✨'}</div>
                                <h3>${srv.title}</h3>
                                <p>${srv.description}</p>
                            </article>
                        `;
                    });
                }

                const portfolioContainer = document.getElementById('dyn-portfolio');
                portfolioContainer.innerHTML = '';
                if (data.portfolio && data.portfolio.length > 0) {
                    data.portfolio.forEach(item => {
                        portfolioContainer.innerHTML += `
                            <a href="${item.video_url || '#'}" class="portfolio-item" target="_blank">
                                <img src="${item.thumbnail || 'https://placehold.co/600x400/18181b/8b5cf6?text=Видео'}" alt="${item.title}">
                                <div class="portfolio-content">
                                    <h3>${item.title}</h3>
                                    <p>${item.description}</p>
                                </div>
                            </a>
                        `;
                    });
                } else {
                    portfolioContainer.innerHTML = '<p style="text-align: center; color: #94a3b8; grid-column: 1 / -1;">Работы скоро появятся.</p>';
                }
                
            } catch (renderError) {
                console.error("Ошибка при отображении данных:", renderError);
                document.getElementById('dyn-services').innerHTML = '<p style="color: #ef4444; text-align: center; grid-column: 1/-1;">Произошла ошибка при загрузке дизайна. Пожалуйста, обновите страницу.</p>';
            }
        }

        function setupContactModal() {
            const modal = document.getElementById('contact-modal');
            const closeBtn = document.querySelector('.modal-close');
            const contactLinks = document.querySelectorAll('a[href="#contacts"]');

            // Открытие окна при клике на любую ссылку "Связаться"
            contactLinks.forEach(link => {
                link.addEventListener('click', (e) => {
                    e.preventDefault(); // Отменяем обычный переход вниз страницы
                    modal.classList.add('active');
                });
            });

            // Закрытие по крестику
            closeBtn.addEventListener('click', () => modal.classList.remove('active'));
            
            // Закрытие по клику на темный фон вокруг окна
            modal.addEventListener('click', (e) => {
                if (e.target === modal) modal.classList.remove('active');
            });
        }

        // Запускаем все функции после загрузки страницы
        document.addEventListener('DOMContentLoaded', () => {
            loadContent();
            setupContactModal();
        });
    </script>
</body>
</html>
