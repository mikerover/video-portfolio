<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="doc-title">Загрузка...</title>
    <meta id="doc-desc" name="description" content="Загрузка...">
    
    <meta property="og:type" content="website">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Inter:wght@400;600;800&family=Outfit:wght@400;600;800&family=Space+Grotesk:wght@400;600;700&family=Syne:wght@400;600;800&display=swap" rel="stylesheet">

    <style>
        :root {
            /* ЗДЕСЬ МОЖНО ПОМЕНЯТЬ ЦВЕТ НАВСЕГДА, ЕСЛИ НУЖНО */
            --bg-dark: #09090b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #8b5cf6;
            --accent-glow: rgba(139, 92, 246, 0.5);
            
            --card-bg: rgba(255, 255, 255, 0.03);
            --border-color: rgba(255, 255, 255, 0.1);
            --main-font: 'Inter', system-ui, sans-serif;
            --heading-font: 'Inter', system-ui, sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: var(--main-font);
            line-height: 1.6;
            overflow-x: hidden;
        }

        header {
            border-bottom: 1px solid var(--border-color);
            background: rgba(9, 9, 11, 0.85);
            backdrop-filter: blur(12px);
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 100;
        }

        nav {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: -1px;
            font-family: var(--heading-font);
            background: linear-gradient(to right, #ffffff, var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        main { padding-top: 80px; }
        section { max-width: 1200px; margin: 0 auto; padding: 5rem 2rem; }

        .hero { text-align: center; position: relative; }
        .hero::before {
            content: '';
            position: absolute;
            top: 20%; left: 50%;
            transform: translate(-50%, -50%);
            width: 320px; height: 320px;
            background: var(--accent);
            filter: blur(150px);
            opacity: 0.35;
            z-index: -1;
        }

        h1, h2, h3 { font-family: var(--heading-font); }
        h1 { font-size: clamp(2.5rem, 5vw, 4rem); line-height: 1.1; margin-bottom: 1.5rem; font-weight: 800; }
        .hero p { color: var(--text-muted); font-size: 1.25rem; max-width: 700px; margin: 0 auto 2rem; }

        .cta-btn {
            display: inline-block;
            background: var(--accent);
            color: #ffffff;
            padding: 1rem 2.5rem;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 0 25px var(--accent-glow);
            border: none;
        }
        .cta-btn:hover { transform: translateY(-2px); box-shadow: 0 0 35px var(--accent-glow); }

        h2 { font-size: 2.5rem; margin-bottom: 3rem; text-align: center; font-weight: 700; }
        h3 { font-size: 1.25rem; margin-bottom: 1rem; color: #ffffff; }

        /* ВАЖНО: Восстановлены рамки и отступы */
        .services-grid, .portfolio-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
        }

        .service-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 2rem;
            border-radius: 16px;
            backdrop-filter: blur(5px);
            transition: transform 0.3s, border-color 0.3s;
        }
        .service-card:hover { transform: translateY(-5px); border-color: var(--accent); }
        .service-card p { color: var(--text-muted); font-size: 0.95rem; }

        .portfolio-item {
            border-radius: 12px;
            overflow: hidden;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            text-decoration: none;
            color: inherit;
            display: block;
            transition: border-color 0.3s, transform 0.3s;
        }
        .portfolio-item:hover { border-color: var(--accent); transform: translateY(-4px); }
        .portfolio-item img { width: 100%; height: 250px; object-fit: cover; border-bottom: 1px solid var(--border-color); }
        .portfolio-content { padding: 1.5rem; }
        .portfolio-content h3 { margin-bottom: 0.5rem; font-size: 1.2rem; }
        .portfolio-content p { color: var(--text-muted); font-size: 0.9rem; }

        .seo-text p { color: var(--text-muted); font-size: 0.95rem; }

        footer { border-top: 1px solid var(--border-color); padding: 3rem 2rem; text-align: center; color: var(--text-muted); }
    </style>
</head>
<body>

    <header>
        <nav>
            <img src="НАЗВАНИЕ_ВАШЕГО_ФАЙЛА.png" alt="Логотип" style="height: 45px; object-fit: contain;">
            <a href="#contacts" class="cta-btn" style="padding: 0.6rem 1.5rem; font-size: 0.9rem;">Связаться</a>
        </nav>
    </header>

    <main>
        <section class="hero">
            <article>
                <h1 id="dyn-hero-title">Загрузка...</h1>
                <p id="dyn-hero-subtitle">Подключение к базе данных контента...</p>
                <a href="#portfolio" class="cta-btn">Смотреть работы</a>
            </article>
        </section>

        <section id="services">
            <h2>Наши услуги и форматы</h2>
            <div class="services-grid" id="dyn-services">
                <p style="text-align: center; color: var(--text-muted); width: 100%; grid-column: 1/-1;">Загрузка услуг...</p>
            </div>
        </section>

        <section id="portfolio">
            <h2>Наше портфолио</h2>
            <div class="portfolio-grid" id="dyn-portfolio">
                <p style="text-align: center; color: var(--text-muted); width: 100%; grid-column: 1/-1;">Загрузка портфолио...</p>
            </div>
        </section>

        <section class="seo-text">
            <h2 id="dyn-seo-title">Загрузка...</h2>
            <article>
                <p id="dyn-seo-text">Загрузка...</p>
            </article>
        </section>
    </main>

    <footer id="contacts">
        <p>&copy; <span id="year"></span> VisionaryAI. Все права защищены. <br>
        Готовы заказать ролики? Напишите нам в Telegram.</p>
    </footer>

    <script>
        document.getElementById('year').textContent = new Date().getFullYear();

        // Загрузка контента из CMS
        async function loadContent() {
            // Резервные данные на случай проблем с сетью
            const fallbackData = {
                meta_title: "VisionaryAI | Заказать видео",
                hero_title: "Профессиональный продакшн:<br>заказать видео и ИИ ролики",
                hero_subtitle: "Мы создаем потрясающие videos, коммерческую анимацию и нейроконтент, который увеличивает продажи.",
                services: [
                    { icon: "🎬", title: "Реклама и Промо", description: "Нужно заказать рекламный ролик? Мы знаем, как привлечь внимание." }
                ],
                portfolio: [],
                seo_title: "Где заказать ролики под ключ?",
                seo_text: "Наш продакшн предлагает полный цикл производства видеоконтента."
            };

            try {
                // Если открыли просто файл с компьютера, не пытаемся качать json
                if (window.location.protocol === 'blob:' || window.location.protocol === 'file:') {
                    console.log("Локальный режим, показываем резервные данные.");
                    renderContent(fallbackData);
                    return;
                }

                // Загружаем настоящий файл из корня сайта (с защитой от кэширования)
                const response = await fetch('content.json?t=' + new Date().getTime());
                if (!response.ok) throw new Error('Файл content.json не найден');
                
                const data = await response.json();
                renderContent(data);
                
            } catch (error) {
                console.warn("Не удалось загрузить content.json, используем резервные данные:", error.message);
                renderContent(fallbackData);
            }
        }

        function renderContent(data) {
            document.getElementById('doc-title').textContent = data.meta_title || 'VisionaryAI';
            
            const descMeta = document.getElementById('doc-desc');
            if(descMeta) descMeta.setAttribute('content', data.meta_description || '');

            document.getElementById('dyn-hero-title').innerHTML = data.hero_title || 'Добро пожаловать';
            document.getElementById('dyn-hero-subtitle').textContent = data.hero_subtitle || '';

            document.getElementById('dyn-seo-title').textContent = data.seo_title || '';
            document.getElementById('dyn-seo-text').textContent = data.seo_text || '';

            // Услуги
            const servicesContainer = document.getElementById('dyn-services');
            servicesContainer.innerHTML = '';
            if (data.services && data.services.length > 0) {
                data.services.forEach(srv => {
                    const iconHtml = srv.icon && (srv.icon.includes('.') || srv.icon.includes('/')) 
                        ? `<img src="${srv.icon}" alt="Иконка" style="width: 40px; height: 40px; margin-bottom: 15px; object-fit: contain;">` 
                        : `<div style="font-size: 2.5rem; margin-bottom: 10px;">${srv.icon || '✨'}</div>`;
                        
                    servicesContainer.innerHTML += `
                        <article class="service-card">
                            ${iconHtml}
                            <h3>${srv.title}</h3>
                            <p>${srv.description}</p>
                        </article>
                    `;
                });
            } else {
                servicesContainer.innerHTML = '<p>Услуги пока не добавлены.</p>';
            }

            // Портфолио
            const portfolioContainer = document.getElementById('dyn-portfolio');
            portfolioContainer.innerHTML = '';
            if (data.portfolio && data.portfolio.length > 0) {
                data.portfolio.forEach(item => {
                    // Если обложка не указана, ставим красивую заглушку-плейсхолдер
                    const thumb = item.thumbnail || 'https://placehold.co/600x400/18181b/8b5cf6?text=Видео+проект';
                    portfolioContainer.innerHTML += `
                        <a href="${item.video_url || '#'}" class="portfolio-item" target="_blank" rel="noopener noreferrer">
                            <img src="${thumb}" alt="Кейс: ${item.title}">
                            <div class="portfolio-content">
                                <h3>${item.title}</h3>
                                <p>${item.description}</p>
                            </div>
                        </a>
                    `;
                });
            } else {
                portfolioContainer.innerHTML = '<p style="text-align: center; color: #94a3b8; grid-column: 1 / -1;">Работы скоро появятся.</p>';
            }
        }

        // Запуск при загрузке страницы
        document.addEventListener('DOMContentLoaded', loadContent);
    </script>
</body>
</html>
