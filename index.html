<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Видео Портфолио</title>
    <style>
        /* Блокируем горизонтальный скролл и фиксируем ширину */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            max-width: 100%;
            overflow-x: hidden;
            background-color: #0f0f0f;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            scroll-behavior: smooth;
        }

        /* Оптимизированный фон без тормозов на iOS */
        body {
            background-image: radial-gradient(circle at 50% -20%, #2a1b3d, #0f0f0f 50%);
            background-attachment: fixed;
        }

        header {
            text-align: center;
            padding: 40px 20px;
        }

        /* ИСПРАВЛЕНИЕ ДЛЯ ANDROID: Резиновый текст и перенос длинных слов */
        h1 {
            font-size: clamp(1.8rem, 8vw, 3.5rem);
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 2px;
            /* Защита от вылезания за пределы экрана */
            word-wrap: break-word;
            overflow-wrap: break-word;
            word-break: break-word;
            hyphens: auto;
            max-width: 100%;
        }

        p.subtitle {
            color: #a0a0a0;
            font-size: 1.1rem;
            margin-top: 10px;
        }

        .portfolio-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .video-item {
            background: #1a1a1a;
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s ease;
            position: relative;
        }

        .video-item:active {
            transform: scale(0.98);
        }

        .preview-img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            display: block;
            background-color: #222;
        }

        .video-title {
            padding: 15px;
            font-size: 1rem;
            text-align: center;
            font-weight: 500;
        }

        /* Кнопки связи */
        .contact-section {
            text-align: center;
            padding: 40px 20px 80px 20px;
        }

        .btn {
            display: inline-block;
            padding: 15px 30px;
            border-radius: 30px;
            text-decoration: none;
            color: white;
            font-weight: bold;
            margin: 10px;
            transition: opacity 0.2s;
        }

        .btn-wa { background: #25D366; }
        .btn-tg { background: #0088cc; }
        
        /* Кнопка наверх */
        #scroll-top {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            text-align: center;
            line-height: 50px;
            font-size: 24px;
            cursor: pointer;
            border: none;
            backdrop-filter: blur(5px);
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        #scroll-top.visible {
            opacity: 1;
            pointer-events: auto;
        }

        /* Универсальный плеер-модалка */
        #video-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 9999;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        #video-modal.active {
            display: flex;
            opacity: 1;
        }

        /* ИСПРАВЛЕНИЕ ДЛЯ iPHONE: Крестик перенесен ВЛЕВО, чтобы не мешать звуку */
        #close-modal {
            position: absolute;
            top: max(20px, env(safe-area-inset-top));
            left: max(20px, env(safe-area-inset-left));
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: none;
            width: 40px; height: 40px;
            border-radius: 50%;
            font-size: 24px;
            line-height: 40px;
            text-align: center;
            cursor: pointer;
            z-index: 10001;
        }

        /* Контейнер плеера (адаптивный) */
        #player-container {
            width: 100%;
            height: 100%;
            max-width: 100vw;
            max-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* Сам плеер */
        video {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain; /* Умное масштабирование без черных рамок */
            background: transparent;
        }

        /* Индикатор загрузки */
        #loader {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 40px; height: 40px;
            border: 4px solid rgba(255,255,255,0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            z-index: -1; /* Прячем за видео, когда оно загрузится */
        }

        /* Окно диагностики ошибок */
        #error-overlay {
            display: none;
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 0, 0, 0.8);
            color: white;
            padding: 15px 30px;
            border-radius: 8px;
            font-weight: bold;
            text-align: center;
            z-index: 10000;
        }

        @keyframes spin { 0% { transform: translate(-50%, -50%) rotate(0deg); } 100% { transform: translate(-50%, -50%) rotate(360deg); } }
    </style>
</head>
<body>

    <header>
        <!-- Текст, который теперь не вылезает за края -->
        <h1>ПРОФЕССИОНАЛЬНЫЙ ВИДЕОМОНТАЖ</h1>
        <p class="subtitle">Портфолио коммерческих работ и моушн-дизайна</p>
    </header>

    <!-- Сетка портфолио -->
    <div class="portfolio-grid" id="portfolio">
        <!-- Видео будут загружаться сюда скриптом -->
    </div>

    <!-- Контакты -->
    <div class="contact-section">
        <h2>Связаться со мной:</h2>
        <!-- Ваш реальный номер WhatsApp -->
        <a href="https://wa.me/79174489817" class="btn btn-wa" target="_blank">Написать в WhatsApp</a>
        <!-- Умная ссылка для Telegram -->
        <a href="tg://resolve?domain=mikerover" class="btn btn-tg">Написать в Telegram</a>
    </div>

    <!-- Кнопка наверх -->
    <button id="scroll-top">↑</button>

    <!-- Модальное окно с видео -->
    <div id="video-modal">
        <button id="close-modal">✕</button>
        <div id="player-container">
            <div id="loader"></div>
            <div id="error-overlay">ОШИБКА: Файл не найден</div>
            <!-- Легальный плеер с жесткими настройками для обхода блокировок Apple -->
            <video id="main-player" autoplay muted controls playsinline webkit-playsinline preload="auto"></video>
        </div>
    </div>

    <script>
        const portfolioGrid = document.getElementById('portfolio');
        const modal = document.getElementById('video-modal');
        const player = document.getElementById('main-player');
        const closeModalBtn = document.getElementById('close-modal');
        const loader = document.getElementById('loader');
        const errorOverlay = document.getElementById('error-overlay');
        const scrollTopBtn = document.getElementById('scroll-top');

        // Загрузка данных (content.json) с принудительным обходом кэша
        fetch('content.json?nocache=' + new Date().getTime())
            .then(response => {
                if (!response.ok) throw new Error('Файл content.json не найден на сервере (Ошибка 404)');
                return response.json();
            })
            .then(data => {
                data.forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'video-item';
                    card.innerHTML = `
                        <img src="img/${item.image}" alt="${item.title}" class="preview-img" onerror="this.src=''; this.style.backgroundColor='#f00';">
                        <div class="video-title">${item.title}</div>
                    `;
                    card.onclick = () => openVideo(item.video_url);
                    portfolioGrid.appendChild(card);
                });
            })
            .catch(err => {
                // Если сломался JSON, выводим детальную причину
                portfolioGrid.innerHTML = `
                    <div style="text-align:center; width:100%; color: #ff6b6b; padding: 20px; background: #2a0000; border-radius: 10px;">
                        <h3 style="margin-top:0;">Сбой загрузки портфолио!</h3>
                        <p>В вашем файле <b>content.json</b> допущена синтаксическая ошибка (например, забытая запятая или кавычка).</p>
                        <p style="font-family: monospace; background: #000; padding: 10px; color: #fff;">Технический лог: ${err.message}</p>
                        <p>Пожалуйста, проверьте файл content.json на GitHub.</p>
                    </div>`;
                console.error(err);
            });

        // Открытие видео (iOS Safe)
        function openVideo(url) {
            // Сначала показываем окно
            modal.classList.add('active');
            errorOverlay.style.display = 'none';
            
            // Подсовываем ссылку в уже существующий плеер
            player.src = url;
            
            // Жесткий старт для Safari
            player.play().catch(e => {
                console.log("Автозапуск заблокирован iOS, ждем клика:", e);
                // Если автозапуск не прошел (режим экономии энергии), оставляем элементы управления
            });
        }

        // Диагностика отсутствующих файлов (Ошибка 404)
        player.addEventListener('error', function() {
            if(player.error && player.error.code === 4) {
                errorOverlay.innerHTML = "ОШИБКА 404:<br>Файл видео не найден на GitHub!";
                errorOverlay.style.display = 'block';
            }
        });

        // Закрытие модального окна
        closeModalBtn.onclick = () => {
            modal.classList.remove('active');
            player.pause();
            player.src = ''; // Очищаем буфер
        };

        // Закрытие по клику мимо видео
        modal.onclick = (e) => {
            if (e.target === modal || e.target === document.getElementById('player-container')) {
                closeModalBtn.click();
            }
        };

        // Кнопка наверх - логика
        window.addEventListener('scroll', () => {
            if (window.scrollY > 300) {
                scrollTopBtn.classList.add('visible');
            } else {
                scrollTopBtn.classList.remove('visible');
            }
        });

        scrollTopBtn.onclick = () => {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };
    </script>
</body>
</html>
