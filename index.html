<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Видео Портфолио</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0f0f0f;
            background-image: radial-gradient(circle at 50% -20%, #2a1b3d, #0f0f0f 50%);
            background-attachment: fixed;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            scroll-behavior: smooth;
        }

        header {
            text-align: center;
            padding: 50px 20px 30px 20px;
        }

        h1 {
            font-size: 2.2rem;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        p.subtitle {
            color: #a0a0a0;
            font-size: 1.1rem;
            margin-top: 10px;
        }

        .portfolio-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .video-item {
            background: #1a1a1a;
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .video-item:active {
            transform: scale(0.98);
        }

        .preview-img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            display: block;
        }

        .video-title {
            padding: 15px;
            font-size: 1rem;
            text-align: center;
            font-weight: 500;
        }

        .contact-section {
            text-align: center;
            padding: 40px 20px 80px 20px;
        }

        .btn {
            display: inline-block;
            padding: 15px 30px;
            border-radius: 30px;
            text-decoration: none;
            color: white;
            font-weight: bold;
            margin: 10px;
            transition: opacity 0.2s;
        }

        .btn-wa { background: #25D366; }
        .btn-tg { background: #0088cc; }
        
        #scroll-top {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            text-align: center;
            line-height: 50px;
            font-size: 24px;
            cursor: pointer;
            border: none;
            backdrop-filter: blur(5px);
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        #scroll-top.visible {
            opacity: 1;
            pointer-events: auto;
        }

        #video-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 9999;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        #video-modal.active {
            display: flex;
            opacity: 1;
        }

        #close-modal {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: none;
            width: 40px; height: 40px;
            border-radius: 50%;
            font-size: 24px;
            line-height: 40px;
            text-align: center;
            cursor: pointer;
            z-index: 10001;
        }

        #player-container {
            width: 100%;
            height: 100%;
            max-width: 100vw;
            max-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        video {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            background: transparent;
        }
    </style>
</head>
<body>

    <header>
        <h1>ПРОФЕССИОНАЛЬНЫЙ ВИДЕОМОНТАЖ</h1>
        <p class="subtitle">Портфолио коммерческих работ и моушн-дизайна</p>
    </header>

    <div class="portfolio-grid" id="portfolio">
        <!-- Контент загружается из JSON -->
    </div>

    <div class="contact-section">
        <h2>Связаться со мной:</h2>
        <a href="https://wa.me/79174489817" class="btn btn-wa" target="_blank">Написать в WhatsApp</a>
        <a href="tg://resolve?domain=mikerover" class="btn btn-tg">Написать в Telegram</a>
    </div>

    <button id="scroll-top">↑</button>

    <div id="video-modal">
        <button id="close-modal">✕</button>
        <div id="player-container">
            <video id="main-player" autoplay muted controls playsinline webkit-playsinline></video>
        </div>
    </div>

    <script>
        const portfolioGrid = document.getElementById('portfolio');
        const modal = document.getElementById('video-modal');
        const player = document.getElementById('main-player');
        const closeModalBtn = document.getElementById('close-modal');
        const scrollTopBtn = document.getElementById('scroll-top');

        // Простая и надежная загрузка без визуальных ошибок
        fetch('content.json')
            .then(response => response.json())
            .then(data => {
                data.forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'video-item';
                    card.innerHTML = `
                        <img src="img/${item.image}" alt="${item.title}" class="preview-img">
                        <div class="video-title">${item.title}</div>
                    `;
                    card.onclick = () => {
                        modal.classList.add('active');
                        player.src = item.video_url;
                    };
                    portfolioGrid.appendChild(card);
                });
            })
            .catch(err => console.error("Ошибка чтения JSON:", err));

        closeModalBtn.onclick = () => {
            modal.classList.remove('active');
            player.pause();
            player.src = ''; 
        };

        modal.onclick = (e) => {
            if (e.target === modal || e.target === document.getElementById('player-container')) {
                closeModalBtn.click();
            }
        };

        window.addEventListener('scroll', () => {
            if (window.scrollY > 300) {
                scrollTopBtn.classList.add('visible');
            } else {
                scrollTopBtn.classList.remove('visible');
            }
        });

        scrollTopBtn.onclick = () => {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };
    </script>
</body>
</html>
