<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex">
  <title>Панель управления сайтом</title>
  <!-- Отключаем автоматический поиск config.yml, чтобы избежать ошибок URL -->
  <script>window.CMS_MANUAL_INIT = true;</script>
</head>
<body>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  
  <script>
    CMS.init({
      config: {
        backend: {
          name: 'github',
          repo: 'mikerover/video-portfolio',
          branch: 'main',
          base_url: 'https://decap-oauth.juniper-agency.com'
        },
        media_folder: 'assets/uploads',
        public_folder: '/assets/uploads',
        publish_mode: 'simple',
        collections: [
          {
            name: 'content',
            label: 'Управление контентом',
            files: [
              {
                label: 'Главная страница',
                name: 'home',
                file: 'content.json',
                fields: [
                  {label: 'SEO: Заголовок', name: 'meta_title', widget: 'string'},
                  {label: 'SEO: Описание', name: 'meta_description', widget: 'text'},
                  {label: 'Главный заголовок', name: 'hero_title', widget: 'string'},
                  {label: 'Подзаголовок', name: 'hero_subtitle', widget: 'text'},
                  {
                    label: 'Услуги',
                    name: 'services',
                    widget: 'list',
                    fields: [
                      {label: 'Иконка', name: 'icon', widget: 'string'},
                      {label: 'Название', name: 'title', widget: 'string'},
                      {label: 'Описание', name: 'description', widget: 'text'}
                    ]
                  },
                  {
                    label: 'Портфолио',
                    name: 'portfolio',
                    widget: 'list',
                    fields: [
                      {label: 'Название', name: 'title', widget: 'string'},
                      {label: 'Описание', name: 'description', widget: 'text'},
                      {label: 'Ссылка на видео', name: 'video_url', widget: 'string'},
                      {label: 'Обложка', name: 'thumbnail', widget: 'image'}
                    ]
                  }
                ]
              }
            ]
          }
        ]
      }
    });
  </script>
</body>
</html>
